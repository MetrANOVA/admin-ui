<!doctype html>
<html lang="en" class="packets">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>MetrANOVA Admin</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Hanuman:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
		/>
		<!-- output.css bundles both the Packets Design System and our own
		 Tailwind utilities for anything not yet migrated to .pkts- classes. -->
		<link rel="stylesheet" href="/styles/output.css" />
		<script src="https://unpkg.com/htmx.org@2.0.4"></script>
		<script src="https://unpkg.com/lucide@latest"></script>
		<script
			src="https://unpkg.com/jsonforms-esm@3.7.0/dist/jsonforms.esm.js"
			type="module"
		></script>

		<script type="module" src="/scripts/customRenderer.js"></script>
		<script type="module" src="/scripts/pkts-form-control.js"></script>
		<script type="module" src="/scripts/pkts-form-actions.js"></script>
		<script src="/components/index.js" type="module"></script>
		<link rel="stylesheet" href="/styles/components.css" />

		<script>
			(function () {
				var theme = localStorage.getItem("theme") || "light";
				var html = document.documentElement;
				html.setAttribute("data-theme", theme);
				html.classList.toggle("dark", theme === "dark");
				html.classList.toggle("light", theme === "light");
			})();
		</script>
	</head>
	<body class="h-dvh overflow-hidden font-sans">
		<div class="flex h-dvh min-h-0 flex-col overflow-hidden">
			<div class="flex min-h-0 flex-1 overflow-hidden">
				<div
					id="nav-left"
					class="h-full shrink-0 overflow-hidden"
					hx-get="/partials/nav_left.html"
					hx-trigger="load"
					hx-swap="innerHTML"
				></div>

				<main
					id="main-content"
					class="h-full min-h-0 min-w-0 flex-1 overflow-x-hidden overflow-y-auto"
				></main>
			</div>
		</div>

		<script type="module" src="/scripts/app.js"></script>
	</body>
</html>
