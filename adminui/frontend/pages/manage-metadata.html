<section class="flex flex-col items-center gap-4 px-[max(6rem,9.6vw)] pt-16 pb-[88px]">
	<div class="flex w-full max-w-[1348px] flex-col items-center gap-6">
		<div class="flex items-center justify-center gap-3">
			<i data-lucide="file-json" class="h-8 w-8 shrink-0 text-copy"></i>
			<h1 class="h1 display2 !font-sans">Metadata Table</h1>
		</div>

		<label class="pkts-input-text pkts-input-search w-full" for="metadata-search">
			<input
				id="metadata-search"
				type="search"
				placeholder="Search Table Name"
				aria-label="Search table name"
				autocomplete="off"
			/>
			<div aria-hidden="true">
				<i data-lucide="search" class="h-5 w-5"></i>
			</div>
		</label>

		<div class="mt-4 w-full overflow-x-auto">
			<table class="pkts-data-table mn-data-table w-full">
				<thead>
					<tr>
						<th scope="col">
							<div class="labelWrapper">Table Name</div>
						</th>
						<!-- Created By is unconfirmed — the API has no concept of users, so it cannot be filled or sorted. -->
						<th scope="col">
							<div class="labelWrapper">
								<span>Created By</span>
								<button
									type="button"
									class="inline-flex text-inherit opacity-70 transition-opacity hover:opacity-100"
									data-filter="created_by"
									aria-label="Filter by created by"
								>
									<i data-lucide="filter" class="h-4 w-4"></i>
								</button>
							</div>
						</th>
						<th scope="col">
							<div class="labelWrapper">
								<span>Created Date</span>
								<button
									type="button"
									class="inline-flex text-inherit opacity-70 transition-opacity hover:opacity-100"
									data-sort="created_at"
									data-label="created date"
									aria-label="Sort by created date"
								>
									<i data-lucide="chevrons-up-down" class="h-4 w-4"></i>
								</button>
								<button
									type="button"
									class="inline-flex text-inherit opacity-70 transition-opacity hover:opacity-100"
									data-filter="created_at"
									aria-label="Filter by created date"
								>
									<i data-lucide="filter" class="h-4 w-4"></i>
								</button>
							</div>
						</th>
					</tr>
				</thead>

				<tbody id="metadata-rows">
					<tr>
						<td colspan="3" class="text-center text-copy-alt">Loading…</td>
					</tr>
				</tbody>

				<tfoot id="metadata-foot">
					<tr>
						<td colspan="3">
							<div class="mn-pager" id="metadata-pager"></div>
						</td>
					</tr>
				</tfoot>
			</table>
		</div>
	</div>
</section>

<div hx-get="/partials/confirm_modal.html" hx-trigger="load" hx-swap="outerHTML"></div>

<script type="module">
	import { PagedTable, escapeHtml, shortDate } from "/scripts/paged-table.js";

	// Metadata types, one page at a time from GET /metadata/. Paging, search and
	// sorting are done by the API (limit / offset / q / sort / order, total in
	// X-Total-Count — MetrANOVA/api#42); the mock backend implements the same
	// contract. Created Date is `created_at`, which the real API does not return
	// yet. Created By has no source at all and shows a dash.
	const table = new PagedTable({
		url: `${window.ADMINUI_API_BASE}/metadata/`,
		tableEl: document.querySelector("#metadata-rows").closest("table"),
		bodyEl: document.getElementById("metadata-rows"),
		pagerEl: document.getElementById("metadata-pager"),
		searchEl: document.getElementById("metadata-search"),
		columnCount: () => 3,
		emptyText: "No tables match that search.",
		renderRows: (types) =>
			types
				.map((type) => {
					const name = escapeHtml(`meta_${type.slug}`);
					return `
						<tr
							class="cursor-pointer"
							hx-get="/pages/metadata-records.html"
							hx-target="#main-content"
							hx-push-url="/metadata-records?type=${encodeURIComponent(type.slug)}"
						>
							<td data-parent="Table Name" title="${name}">${name}</td>
							<td data-parent="Created By" title="Not provided by the API yet">—</td>
							<td data-parent="Created Date">${shortDate(type.created_at || type.updated_at)}</td>
						</tr>
					`;
				})
				.join(""),
	});

	table.load();
</script>
