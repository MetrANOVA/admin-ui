<section class="flex flex-col items-center gap-4 px-16 pt-[28px] pb-[88px]">
	<div class="flex w-full max-w-[1348px] flex-col items-center gap-6">
		<div class="flex items-center justify-center gap-3">
			<i data-lucide="file-json" class="h-8 w-8 shrink-0 text-copy"></i>
			<h1 class="h1 display2">Metadata Table</h1>
		</div>

		<label class="pkts-input-text pkts-input-search w-full" for="metadata-search">
			<input
				id="metadata-search"
				type="search"
				placeholder="Search Table Name"
				aria-label="Search table name"
				autocomplete="off"
			/>
			<div aria-hidden="true">
				<i data-lucide="search" class="h-5 w-5"></i>
			</div>
		</label>

		<div class="w-full overflow-x-auto">
			<table class="pkts-data-table w-full">
				<thead>
					<tr>
						<th scope="col">
							<div class="labelWrapper">Table Name</div>
						</th>
						<th scope="col">
							<div class="labelWrapper">
								<span>Created By</span>
								<button
									type="button"
									class="inline-flex text-inherit opacity-70 transition-opacity hover:opacity-100"
									data-sort="created_by"
									aria-label="Sort by created by"
								>
									<i data-lucide="chevrons-up-down" class="h-4 w-4"></i>
								</button>
								<button
									type="button"
									class="inline-flex text-inherit opacity-70 transition-opacity hover:opacity-100"
									data-filter="created_by"
									aria-label="Filter by created by"
								>
									<i data-lucide="filter" class="h-4 w-4"></i>
								</button>
							</div>
						</th>
						<th scope="col">
							<div class="labelWrapper">
								<span>Created Date</span>
								<button
									type="button"
									class="inline-flex text-inherit opacity-70 transition-opacity hover:opacity-100"
									data-sort="created_at"
									aria-label="Sort by created date"
								>
									<i data-lucide="chevrons-up-down" class="h-4 w-4"></i>
								</button>
								<button
									type="button"
									class="inline-flex text-inherit opacity-70 transition-opacity hover:opacity-100"
									data-filter="created_at"
									aria-label="Filter by created date"
								>
									<i data-lucide="filter" class="h-4 w-4"></i>
								</button>
							</div>
						</th>
					</tr>
				</thead>

				<tbody id="metadata-rows">
					<tr>
						<td colspan="3" class="text-center text-copy-alt">Loading…</td>
					</tr>
				</tbody>

				<tfoot>
					<tr>
						<td colspan="3">
							<div
								class="flex flex-wrap items-center justify-center gap-2"
								id="metadata-pager"
							></div>
						</td>
					</tr>
				</tfoot>
			</table>
		</div>
	</div>
</section>

<script type="module">
	// Layout pass for issue #3. Rows come from placeholder data on purpose:
	// GET /metadata/ has no paging, search or sort, and returns neither
	// Created By nor Created Date. Those are open questions on the issue.
	const PAGE_SIZE = 12;

	// Names taken from the mockup so the shape of the page is visible before the
	// real endpoint is wired up (issue #9).
	const PLACEHOLDER = [
		"meta_as",
		"meta_circuit",
		"meta_device",
		"meta_interface",
		"meta_ip",
		"meta_organization",
		"meta_esdb_org_name_dict",
		"meta_interface_esdb",
		"meta_ip_cric",
		"meta_ip_esdb",
		"meta_ip_scireg",
		"meta_kvp",
		"meta_pop",
		"meta_service",
		"meta_tag",
	].map((name) => ({ name, created_by: "jlee@es.net", created_at: "07/13/27" }));

	const rowsEl = document.getElementById("metadata-rows");
	const pagerEl = document.getElementById("metadata-pager");
	const searchEl = document.getElementById("metadata-search");

	let query = "";
	let page = 1;

	function visibleRows() {
		const q = query.trim().toLowerCase();
		return q ? PLACEHOLDER.filter((row) => row.name.toLowerCase().includes(q)) : PLACEHOLDER;
	}

	function renderRows(rows) {
		if (!rows.length) {
			rowsEl.innerHTML = `<tr><td colspan="3" class="text-center text-copy-alt">No tables match that search.</td></tr>`;
			return;
		}
		rowsEl.innerHTML = rows
			.map(
				(row) => `
					<tr>
						<td data-parent="Table Name">${row.name}</td>
						<td data-parent="Created By">${row.created_by}</td>
						<td data-parent="Created Date">${row.created_at}</td>
					</tr>
				`,
			)
			.join("");
	}

	function pageButton(label, targetPage, { active = false, disabled = false } = {}) {
		const variant = active ? "pkts-primary" : "pkts-secondary";
		return `<button type="button" class="pkts-button pkts-small ${variant}" data-page="${targetPage}"${
			disabled ? " disabled" : ""
		}>${label}</button>`;
	}

	function renderPager(totalPages) {
		if (totalPages <= 1) {
			pagerEl.innerHTML = "";
			return;
		}
		const parts = [pageButton("Prev", page - 1, { disabled: page === 1 })];
		const shown = [...new Set([1, page, totalPages])].sort((a, b) => a - b);
		let previous = 0;
		for (const n of shown) {
			if (n - previous > 1) {
				parts.push(`<span class="px-1 text-copy-alt">…</span>`);
			}
			parts.push(pageButton(String(n), n, { active: n === page }));
			previous = n;
		}
		parts.push(pageButton("Next", page + 1, { disabled: page === totalPages }));
		pagerEl.innerHTML = parts.join("");
	}

	function render() {
		const rows = visibleRows();
		const totalPages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
		page = Math.min(page, totalPages);
		renderRows(rows.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE));
		renderPager(totalPages);
		if (window.lucide) {
			window.lucide.createIcons();
		}
	}

	searchEl.addEventListener("input", (event) => {
		query = event.target.value;
		page = 1;
		render();
	});

	pagerEl.addEventListener("click", (event) => {
		const button = event.target.closest("[data-page]");
		if (!button || button.disabled) {
			return;
		}
		page = Number(button.dataset.page);
		render();
	});

	render();
</script>
