<!--
	JSONForms' own boolean and array renderers come unstyled. Scoped to this
	editor; the array rules mirror .pipeline-json-form in input.css and can move
	there once the two forms share a class.
-->
<style>
	/* components.css gives these labels a fixed dark colour */
	#records-fields .form-container label {
		color: var(--copy);
	}
	#records-fields .control {
		display: flex;
		flex-direction: column;
		gap: 8px;
	}
	#records-fields .control:has(input[type="checkbox"]) {
		flex-direction: row-reverse;
		justify-content: flex-end;
		align-items: center;
		gap: 0.75rem;
	}
	#records-fields .control .label,
	#records-fields .array-list-label {
		font-size: 14px;
		font-weight: 500;
		color: var(--copy);
	}
	#records-fields .control input[type="checkbox"] {
		width: 1.25rem;
		height: 1.25rem;
		accent-color: var(--primary);
	}
	#records-fields .control input[type="number"],
	#records-fields .control input[type="text"] {
		width: 100%;
		height: 42px;
		padding: 0 0.5rem;
		border: 1px solid var(--copy-alt);
		border-radius: 2px;
		background: var(--background);
		color: var(--copy);
	}
	#records-fields .control .error {
		font-size: 0.875rem;
		color: var(--error);
	}
	#records-fields .array-list {
		margin: 0;
		padding: 0.5rem 0.75rem 0.75rem;
		border: 1px solid var(--copy-alt);
		border-radius: 8px;
	}
	#records-fields .array-list-legend {
		display: flex;
		flex-direction: row-reverse;
		align-items: center;
		gap: 0.5rem;
		padding: 0 0.25rem;
	}
	#records-fields .array-list-item {
		display: flex;
		flex-direction: row-reverse;
		align-items: center;
		gap: 0.5rem;
		margin-top: 0.5rem;
	}
	#records-fields .array-list-item-content {
		flex: 1;
		min-width: 0;
	}
	#records-fields .array-list-item-content input {
		width: 100%;
		padding: 0.375rem 0.5rem;
		border: 1px solid var(--copy-alt);
		border-radius: 4px;
		background: var(--background);
		color: var(--copy);
	}
	#records-fields .array-list-item-toolbar {
		display: flex;
		align-items: center;
		gap: 0.25rem;
	}
	#records-fields .array-list-item-label,
	#records-fields .array-list-item-move-up,
	#records-fields .array-list-item-move-down {
		display: none;
	}
	#records-fields .array-list-add,
	#records-fields .array-list-item-delete {
		width: 1.75rem;
		height: 1.75rem;
		border: 1px solid var(--copy-alt);
		border-radius: 9999px;
		background: transparent;
		color: var(--copy);
		line-height: 1;
		cursor: pointer;
	}
	#records-fields .array-list-no-data {
		margin: 0.5rem 0 0;
		font-size: 0.875rem;
		color: var(--copy-alt);
	}
</style>

<section
	class="flex flex-col items-center gap-4 px-[max(6rem,9.6vw)] pt-16 pb-[88px]"
	id="records"
	data-state="choose"
>
	<div class="flex w-full max-w-[1348px] flex-col items-center gap-6">
		<!-- No back button: the final mockups drop it; the nav leads back to the list -->
		<h1 class="h1 display2 !font-sans" id="records-title">meta_interface</h1>

		<div class="flex w-full flex-col gap-4 rounded border border-shadow bg-surface1 p-8">
			<p class="text-base text-copy-alt" data-only="choose">Choose a row to edit</p>

			<div class="flex w-full items-stretch gap-6">
				<div class="min-w-0 flex-1 overflow-x-auto rounded-[8px]" id="records-table-wrap">
					<table class="pkts-data-table mn-data-table w-full">
						<thead id="records-head"></thead>
						<tbody id="records-rows"></tbody>
						<tfoot id="records-foot">
							<tr>
								<td id="records-foot-cell">
									<div class="mn-pager" id="records-pager"></div>
								</td>
							</tr>
						</tfoot>
					</table>
				</div>

				<!--
					Edit panel. Drawn as a side panel on the same page, which differs from
					Johanna's comment #62 (a separate page) — flagged on issue #3.
					Save/Cancel sit below the panel, inside the card, as drawn in the
					final mockups; Save feeds the confirm modal.

					The fields are a JSONForms <json-form>, on the renderer set up in
					scripts/customRenderer.js. The schema is derived here from the column
					types; once the API serves a schema and UI schema per table (the
					pscompose pattern: GET …/form/), those replace schemaFor/layoutFor.
				-->
				<!--
					The panel is sized by the table next to it (a page of rows), not by its
					own fields: the scroller is absolutely placed, so the form adds no
					height of its own and the two line up top and bottom.
				-->
				<form
					class="relative min-w-0 flex-1 rounded-[12px] bg-surface2"
					id="records-editor"
					data-only="edit"
					novalidate
				>
					<div class="absolute inset-0 flex flex-col gap-4 overflow-y-auto p-6">
						<!-- Holds one <json-form>, rebuilt for every selected row -->
						<div id="records-fields"></div>
						<ul
							id="records-errors"
							class="m-0 list-none p-0 text-sm text-error"
							role="alert"
							style="display: none"
						></ul>
					</div>
				</form>
			</div>

			<!-- Drawn below the panel, inside the card; Save submits the editor via form= -->
			<div class="flex justify-end gap-3" data-only="edit">
				<button
					type="button"
					id="records-cancel"
					class="pkts-button inline-flex items-center gap-2 border-copy-alt bg-copy-alt text-background"
				>
					<i data-lucide="x" class="h-5 w-5"></i>
					Cancel
				</button>
				<button
					type="submit"
					form="records-editor"
					id="records-save"
					disabled
					class="pkts-button inline-flex items-center gap-2 border-success bg-success text-white disabled:cursor-not-allowed disabled:opacity-50"
				>
					<i data-lucide="save" class="h-5 w-5"></i>
					Save
				</button>
			</div>
		</div>

	</div>
</section>

<div hx-get="/partials/confirm_modal.html" hx-trigger="load" hx-swap="outerHTML"></div>

<script type="module">
	import { PagedTable, escapeHtml } from "/scripts/paged-table.js";

	// The records of one metadata type (?type=<slug>), in two states: choose
	// (pick a row) and edit (side panel). Columns come from the type definition
	// (GET /type/{slug}); rows come one page at a time from GET /metadata/{slug}
	// with limit / offset / sort / order and the total in X-Total-Count
	// (MetrANOVA/api#42). The mock backend implements the same contract.
	const API = window.ADMINUI_API_BASE;
	const slug = new URLSearchParams(window.location.search).get("type") || "interface";
	const RECORD_ID = "id";

	// Reserved columns are set by the system and locked in the API; they show
	// in the table but not in the editor.
	const RESERVED = new Set([
		"id",
		"ref",
		"hash",
		"created_at",
		"insert_time",
		"updated_at",
		"tag",
		"policy_level",
		"policy_scope",
		"policy_originator",
		"ext",
	]);

	// Only id and ref carry sort/filter, as drawn. Johanna's note on the mockup
	// says she isn't sure which columns should — "perhaps primary key cols?".
	const SORTABLE = new Set(["id", "ref"]);

	// System columns shown ahead of the type's own fields.
	const LEADING = [
		["id", "String"],
		["ref", "String"],
		["hash", "String"],
		["insert_time", "DateTime"],
		["ext", "JSON"],
		["tag", "Array(String)"],
	].map(([name, type]) => ({ name, type }));

	let COLUMNS = LEADING;
	let EDITABLE = [];
	let IDENTIFIER = new Set();

	const root = document.getElementById("records");
	const headEl = document.getElementById("records-head");
	const rowsEl = document.getElementById("records-rows");
	const pagerEl = document.getElementById("records-pager");
	const footCell = document.getElementById("records-foot-cell");
	const editorEl = document.getElementById("records-editor");
	const fieldsEl = document.getElementById("records-fields");
	const errorsEl = document.getElementById("records-errors");
	const saveEl = document.getElementById("records-save");
	const tableWrap = document.getElementById("records-table-wrap");

	let table = null;
	let selectedId = null;

	document.getElementById("records-title").textContent = `meta_${slug}`;

	function show(value) {
		if (value === null || value === undefined) return "";
		if (Array.isArray(value)) return value.join(", ");
		if (typeof value === "object") return JSON.stringify(value);
		return String(value);
	}

	// Hashes are long and only need to be told apart at a glance.
	function display(col, value) {
		const text = show(value);
		return col.name === "hash" && text.length > 9 ? `${text.slice(0, 4)}…${text.slice(-4)}` : text;
	}

	function selected() {
		return table ? table.items.find((rec) => rec[RECORD_ID] === selectedId) : undefined;
	}

	function setState(state) {
		root.dataset.state = state;
		root.querySelectorAll("[data-only]").forEach((el) => {
			el.style.display = el.dataset.only === state ? "" : "none";
		});
		// In edit the table gives up half the card; the mockup keeps it visible.
		tableWrap.classList.toggle("max-w-[50%]", state === "edit");
		if (state !== "edit") {
			selectedId = null;
		}
		markSelection();
		fitPager();
	}

	function markSelection() {
		for (const row of rowsEl.querySelectorAll("tr[data-id]")) {
			if (row.dataset.id === selectedId) row.setAttribute("aria-selected", "true");
			else row.removeAttribute("aria-selected");
		}
	}

	function iconButton(icon, label, attrs = "") {
		return `<button type="button" class="inline-flex text-inherit opacity-70 transition-opacity hover:opacity-100" aria-label="${label}"${attrs}><i data-lucide="${icon}" class="h-4 w-4"></i></button>`;
	}

	function renderHead() {
		headEl.innerHTML = `<tr>${COLUMNS.map(
			(col) =>
				`<th scope="col"><div class="labelWrapper whitespace-nowrap"><span class="mono">${escapeHtml(col.name)}</span>${
					SORTABLE.has(col.name)
						? iconButton("chevrons-up-down", `Sort by ${col.name}`, ` data-sort="${col.name}"`) +
							iconButton("filter", `Filter by ${col.name}`)
						: ""
				}</div></th>`,
		).join("")}</tr>`;
		footCell.colSpan = COLUMNS.length;
	}

	function renderRows(records) {
		return records
			.map((rec) => {
				const isSelected = rec[RECORD_ID] === selectedId;
				return `<tr data-id="${escapeHtml(rec[RECORD_ID])}" class="cursor-pointer"${isSelected ? ' aria-selected="true"' : ""}>${COLUMNS.map(
					(col) =>
						`<td data-parent="${escapeHtml(col.name)}" class="mono whitespace-nowrap" title="${escapeHtml(show(rec[col.name]))}">${escapeHtml(display(col, rec[col.name]))}</td>`,
				).join("")}</tr>`;
			})
			.join("");
	}

	// Save stays disabled until the form differs from the record. JSONForms
	// takes the new value on the field's change event, so read it a tick later.
	function syncSave() {
		setTimeout(() => {
			const rec = selected();
			const form = document.getElementById("records-json-form");
			let data = null;
			try {
				data = form?.serializeForm ? JSON.parse(form.serializeForm()) : null;
			} catch {
				data = null;
			}
			saveEl.disabled = !rec || !data || currentEdits(rec, data).length === 0;
		}, 0);
	}
	editorEl.addEventListener("input", syncSave);
	editorEl.addEventListener("change", syncSave);
	editorEl.addEventListener("click", syncSave);
	document.body.addEventListener("json-form:updated", syncSave);

	// ClickHouse column type → JSON Schema. Formats are checked by JSONForms'
	// validator, so a malformed IPv4 never reaches the confirm dialog.
	function propertyFor(type) {
		const array = type.match(/^Array\((.+)\)$/);
		if (array) return { type: "array", items: propertyFor(array[1]) };
		if (type === "Bool") return { type: "boolean" };
		if (/^U?Int\d+$/.test(type)) {
			return { type: "integer", ...(type.startsWith("U") ? { minimum: 0 } : {}) };
		}
		if (/^Float\d+$/.test(type)) return { type: "number" };
		if (type === "IPv4") return { type: "string", format: "ipv4" };
		if (type === "IPv6") return { type: "string", format: "ipv6" };
		return { type: "string" };
	}

	// Identifier fields make up the record's id; the API refuses to change
	// them, so they are shown read-only.
	function schemaFor() {
		return {
			type: "object",
			properties: Object.fromEntries(
				EDITABLE.map((col) => [
					col.name,
					{
						title: col.name,
						...propertyFor(col.type),
						...(IDENTIFIER.has(col.name) ? { readOnly: true } : {}),
					},
				]),
			),
		};
	}

	// Text goes to the Packets input. Booleans, numbers and arrays stay on
	// JSONForms' own renderers for now, because pkts-form-control reads and
	// writes `value` as-is (the mismatch tracked in #11):
	//   - the Packets switch/checkbox work through `checked`, so a boolean comes
	//     back as "on";
	//   - pkts-input-number hands back a string, so an edited integer fails the
	//     schema with "must be integer".
	// Moving them over later is one line each here.
	function layoutFor() {
		return {
			type: "VerticalLayout",
			elements: EDITABLE.map((col) => {
				const control = { type: "Control", scope: `#/properties/${col.name}` };
				if (propertyFor(col.type).type === "string") {
					control.customComponent = "pkts-input-text";
				}
				return control;
			}),
		};
	}

	// Nulls are left out: the schema says string/integer, and null is neither.
	function formDataFor(rec) {
		return Object.fromEntries(
			EDITABLE.filter((col) => rec[col.name] !== null && rec[col.name] !== undefined).map(
				(col) => [col.name, rec[col.name]],
			),
		);
	}

	// A fresh element per row. Updating form-data on a mounted form leaves the
	// Packets inputs showing the previous row's text.
	function renderEditor(rec) {
		const form = document.createElement("json-form");
		form.id = "records-json-form";
		form.setAttribute("schema-data", JSON.stringify(schemaFor()));
		form.setAttribute("layout-data", JSON.stringify(layoutFor()));
		form.setAttribute("form-data", JSON.stringify(formDataFor(rec)));
		fieldsEl.replaceChildren(form);
		showErrors([]);
	}

	function showErrors(messages) {
		errorsEl.innerHTML = messages.map((message) => `<li>${escapeHtml(message)}</li>`).join("");
		errorsEl.style.display = messages.length ? "" : "none";
	}

	// The table is far wider than its scroll container, so a centred pager would
	// sit off-screen: pin it to the visible width, and follow the container when
	// the window or the side panel changes that width.
	pagerEl.classList.add("sticky", "left-0");
	function fitPager() {
		const cell = getComputedStyle(footCell);
		const padding = parseFloat(cell.paddingLeft) + parseFloat(cell.paddingRight);
		pagerEl.style.width = `${Math.max(0, tableWrap.clientWidth - padding)}px`;
	}
	new ResizeObserver(fitPager).observe(tableWrap);

	function currentEdits(rec, data) {
		return EDITABLE.flatMap((col) => {
			const before = show(rec[col.name]);
			const after = show(data[col.name]);
			return before === after
				? []
				: [
						{
							key: rec[RECORD_ID],
							column: col.name,
							original: before || "—",
							changed: after || "—",
						},
					];
		});
	}

	document.getElementById("records-cancel").addEventListener("click", () => setState("choose"));

	rowsEl.addEventListener("click", (event) => {
		const row = event.target.closest("tr[data-id]");
		if (!row) return;
		selectedId = row.dataset.id;
		renderEditor(selected());
		syncSave();
		setState("edit");
	});

	// One PUT per record, the whole record as the body — records are saved one
	// at a time by team decision. A field emptied in the form is sent as null.
	async function save(rec, data) {
		const body = { ...rec };
		for (const col of EDITABLE) {
			body[col.name] = col.name in data ? data[col.name] : null;
		}
		const version = rec.ref.split("__v").pop();
		const url = `${API}/metadata/${encodeURIComponent(slug)}/${encodeURIComponent(rec[RECORD_ID])}/${version}`;
		try {
			const response = await fetch(url, {
				method: "PUT",
				headers: { "Content-Type": "application/json" },
				credentials: "include",
				body: JSON.stringify(body),
			});
			if (!response.ok) {
				const detail = (await response.json().catch(() => ({}))).detail;
				showErrors([typeof detail === "string" ? detail : `Save failed (HTTP ${response.status}).`]);
				return;
			}
		} catch {
			showErrors(["Cannot reach the API."]);
			return;
		}
		setState("choose");
		table.load();
	}

	// Save → confirm dialog with the diff → PUT → back to choosing a row.
	editorEl.addEventListener("submit", (event) => {
		event.preventDefault();
		const rec = selected();
		const form = document.getElementById("records-json-form");
		if (!rec || !form) return;
		// novalidate on the form: pkts-form-control is form-associated and flags
		// itself invalid, which makes the browser swallow the submit before this
		// handler can say what is wrong.
		if (!form.validate()) {
			showErrors(
				form
					.errors()
					.map((error) => `${error.instancePath.replace(/^\//, "")}: ${error.message}`),
			);
			return;
		}
		showErrors([]);
		const data = JSON.parse(form.serializeForm());
		const rows = currentEdits(rec, data);
		if (!rows.length) return;
		window.openConfirmModal({
			title: `Are you sure you want to change content for ${rec[RECORD_ID]}?`,
			rows,
			onConfirm: () => save(rec, data),
		});
	});

	async function init() {
		let typeDef;
		try {
			const response = await fetch(`${API}/type/${encodeURIComponent(slug)}`, { credentials: "include" });
			if (response.status === 404) throw new Error(`Metadata type "${slug}" was not found.`);
			if (!response.ok) throw new Error(`Could not load the table definition (HTTP ${response.status}).`);
			typeDef = await response.json();
		} catch (error) {
			const text = error instanceof TypeError ? "Cannot reach the API." : error.message;
			rowsEl.innerHTML = `<tr><td class="text-center text-copy-alt">${escapeHtml(text)}</td></tr>`;
			return;
		}

		COLUMNS = [
			...LEADING,
			...typeDef.meta_fields.map((field) => ({ name: field.field_name, type: field.field_type })),
		];
		EDITABLE = COLUMNS.filter((col) => !RESERVED.has(col.name));
		IDENTIFIER = new Set(typeDef.identifier);

		renderHead();
		setState("choose");
		table = new PagedTable({
			url: `${API}/metadata/${encodeURIComponent(slug)}`,
			tableEl: rowsEl.closest("table"),
			bodyEl: rowsEl,
			pagerEl,
			columnCount: () => COLUMNS.length,
			emptyText: "This table has no records yet.",
			renderRows,
			// Room for the Save/Cancel row that appears under the table in edit.
			reserve: 24,
			onRender: () => {
				fitPager();
				// The row being edited can leave the page when the page size changes.
				if (root.dataset.state === "edit" && !selected()) setState("choose");
			},
		});
		table.load();
	}

	init();
</script>
