<!--
	Packets paints the code block grey, and near-black in dark mode; the mockup
	draws it on the plain row surface with a copy-alt-2 stroke.
-->
<style>
	.packets .pkts-code-block.pipeline-code {
		background: var(--mn-table-surface);
		border: 1px solid var(--copy-alt-2);
		border-radius: 4px;
		color: var(--copy);
	}
	.packets .pipeline-code .pkts-code-block-lang-chip {
		background: var(--surface-1);
		color: var(--copy);
	}
</style>

<section class="flex flex-col items-center gap-4 px-[max(6rem,9.6vw)] pt-16 pb-[88px]">
	<div class="flex w-full max-w-[1348px] flex-col items-center gap-6">
		<div class="relative mb-6 flex h-9 w-full items-center justify-center">
			<a
				href="/pipelines"
				hx-get="/pages/pipelines.html"
				hx-target="#main-content"
				hx-push-url="/pipelines"
				class="absolute left-0 inline-flex h-9 w-16 items-center justify-center rounded-full bg-copy-alt !text-surface2"
				aria-label="Back to Pipelines"
			>
				<i data-lucide="undo-2" class="h-5 w-5"></i>
			</a>
		</div>

		<div class="flex w-full flex-col gap-8 rounded border border-shadow bg-surface1 px-10 py-8">
			<div class="flex w-full items-center justify-center gap-3 self-stretch">
				<i data-lucide="workflow" class="h-8 w-8 shrink-0 text-copy"></i>
				<h1 class="h2 !mb-0 !w-auto !font-sans" id="pipeline-title">…</h1>
			</div>

			<!-- Fields and rule layout follow the updated mockup (9 Oct), which uses the API's transformer schema. -->
			<dl class="grid grid-cols-1 gap-x-12 gap-y-5 md:grid-cols-2" id="pipeline-facts">
				<div>
					<dt class="label text-copy-alt">Table Name</dt>
					<dd class="text-base text-copy" data-fact="definition_ref"></dd>
				</div>
				<div>
					<dt class="label text-copy-alt">Pipeline Name</dt>
					<dd class="text-base text-copy" data-fact="name"></dd>
				</div>
				<div class="md:col-span-2">
					<dt class="label text-copy-alt">Description</dt>
					<dd class="max-w-prose text-base text-copy" data-fact="description"></dd>
				</div>
				<div class="md:col-span-2">
					<dt class="label text-copy-alt">Match Field</dt>
					<dd class="text-base text-copy" data-fact="match_field"></dd>
				</div>
			</dl>

			<div class="flex flex-col gap-3">
				<p class="label text-copy-alt">Mapping Rules</p>
				<div class="flex flex-col gap-4" id="pipeline-rules"></div>
			</div>

			<div class="flex justify-end">
				<a
					href="/define-pipeline"
					hx-get="/pages/define-pipelines.html"
					hx-target="#main-content"
					hx-push-url="/define-pipeline"
					class="inline-flex h-10 shrink-0 items-center gap-2 whitespace-nowrap rounded-full bg-accent px-5 text-sm font-semibold !text-white !no-underline transition hover:brightness-95"
				>
					Edit Pipeline
					<i data-lucide="arrow-right" class="h-5 w-5"></i>
				</a>
			</div>
			<div class="flex flex-col gap-3">
				<p class="label text-copy-alt">Preview</p>
				<div class="pkts-code-block pipeline-code max-h-[520px]">
					<div class="pkts-code-block-top">
						<span class="pkts-code-block-lang-chip">yaml</span>
						<button
							type="button"
							id="pipeline-copy"
							class="inline-flex text-copy-alt transition-opacity hover:opacity-70"
							aria-label="Copy to clipboard"
							title="Copy"
						>
							<i data-lucide="copy" class="h-4 w-4"></i>
						</button>
					</div>
					<pre class="m-0 font-mono text-sm leading-relaxed" id="pipeline-preview"></pre>
				</div>
			</div>

		</div>
	</div>
</section>

<script type="module">
	// Layout pass for issue #6. Shows one transformer the way GET /transformers/{id}
	// and GET /transformers/{id}/columns/ return it. all_interfaces is the bootstrap
	// example from the API repo; the rest are placeholders so the list has
	// something to open. ?id= picks the pipeline; unknown ids fall back to the
	// first one.
	const column = (id, target_column, match_value, operation, config, order) => ({
		id,
		target_column,
		match_value,
		operation,
		config,
		order,
	});

	const PIPELINES = {
		all_interfaces: {
			id: "all_interfaces",
			name: "all_interfaces",
			definition_ref: "def_interface",
			description: "Interface Traffic transformers",
			match_field: "protocol",
			columns: [
				column("inUcast_field", "inUcast", "snmp", "field", { source: "SNMP_IF-MIB::ifHCInUcastPkts" }, 1),
				column("outUcast_field", "outUcast", "snmp", "field", { source: "SNMP_IF-MIB::ifHCOutUcastPkts" }, 2),
				column("inerror_field", "inerror", "snmp", "field", { source: "SNMP_IF-MIB::ifInErrors" }, 3),
				column("outerror_field", "outerror", "snmp", "field", { source: "SNMP_IF-MIB::ifOutErrors" }, 4),
				column("input_field", "input", "snmp", "postfix", { field: "SNMP_IF-MIB::ifHCInOctets", expression: "value 8 *", cast: "int" }, 5),
				column("output_field", "output", "snmp", "postfix", { field: "SNMP_IF-MIB::ifHCOutOctets", expression: "value 8 *", cast: "int" }, 6),
			],
		},
		meta_interface: {
			id: "meta_interface",
			name: "meta_interface",
			definition_ref: "meta_interface",
			description: "Interface metadata from ESDB, keyed by device and port",
			match_field: "source",
			columns: [
				column("device_field", "device_id", "esdb", "regex_extract", { source: "name", regex: "^([^:]+)::", group: 1 }, 1),
				column("port_field", "port", "esdb", "regex_extract", { source: "name", regex: "::(.+)$", group: 1 }, 2),
				column("speed_field", "speed", "esdb", "postfix", { field: "if_speed_mbps", expression: "value 1000000 *", cast: "int" }, 3),
				column("edge_field", "edge", "esdb", "translate", { source: "role", map: { customer: "true", peer: "true" }, default: "false" }, 4),
			],
		},
	};

	const params = new URLSearchParams(window.location.search);
	const requested = params.get("id");
	const pipeline =
		PIPELINES[requested] ||
		Object.assign({}, PIPELINES.all_interfaces, requested ? { id: requested, name: requested } : {});
	document.getElementById("pipeline-title").textContent = pipeline.name;

	for (const dd of document.querySelectorAll("[data-fact]")) {
		dd.textContent = pipeline[dd.dataset.fact] || "—";
	}

	function escapeHtml(value) {
		return String(value).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
	}

	// One labelled value, the small label above it as in the mockup.
	function pair(label, value) {
		return `<span class="flex flex-col"><span class="text-xs text-copy-alt">${label}</span><span>${escapeHtml(value)}</span></span>`;
	}

	// A rule reads: WRITE TO <column> WHEN <match field> = <value> [AND <vendor
	// field> = <value>] THEN <operation> <config> [ELSE <default>]. The vendor
	// condition and the default are optional and only shown when set.
	function ruleCard(col, index) {
		const keyword = (word) => `<span class="pt-4 font-mono text-sm text-copy-alt">${word}</span>`;
		const vendor =
			col.vendor_match_field || col.vendor_match_value
				? `${keyword("AND")}${pair("Vendor Field", col.vendor_match_field ?? "—")}<span class="pt-4">=</span>${pair("Vendor Value", col.vendor_match_value ?? "—")}`
				: "";
		const fallback =
			col.default_value !== undefined && col.default_value !== null && col.default_value !== ""
				? `<div class="flex flex-wrap items-start gap-x-4 gap-y-2">${keyword("ELSE")}${pair("Default Value", col.default_value)}</div>`
				: "";
		return `
			<article class="relative flex flex-col gap-4 rounded border border-dashed border-copy-alt px-6 pb-5 pt-7 text-base text-copy">
				<span class="absolute -top-2.5 left-4 bg-surface1 px-1 text-xs font-semibold uppercase tracking-wide text-accent">Rule ${index + 1}</span>
				<div class="flex flex-wrap items-start gap-x-4 gap-y-2">
					${keyword("WRITE TO")}${pair("Target Column", col.target_column)}
					${keyword("WHEN")}${pair("Match Field", pipeline.match_field)}<span class="pt-4">=</span>${pair("Match Value", col.match_value ?? "—")}
					${vendor}
				</div>
				<div class="flex flex-wrap items-start gap-x-4 gap-y-2">
					${keyword("THEN")}${pair("Operation", col.operation)}
					<span class="flex min-w-0 flex-col">
						<span class="text-xs text-copy-alt">Config</span>
						<pre class="m-0 overflow-x-auto font-mono text-sm leading-relaxed">${escapeHtml(JSON.stringify(col.config, null, 4))}</pre>
					</span>
				</div>
				${fallback}
			</article>
		`;
	}

	const columns = [...pipeline.columns].sort((a, b) => a.order - b.order);
	document.getElementById("pipeline-rules").innerHTML = columns.map(ruleCard).join("");

	// Same shape as bootstrap/transformers/*.yaml in the API repo.
	function toYaml(p) {
		const lines = [
			"transformers:",
			`  ${p.id}:`,
			`    definition_id: ${p.definition_ref}`,
			`    description: ${p.description}`,
			`    match_field: ${p.match_field}`,
			"    columns:",
		];
		for (const col of columns) {
			lines.push(`      ${col.id}:`);
			lines.push(`        target_column: ${col.target_column}`);
			lines.push(`        match_value: ${col.match_value}`);
			lines.push(`        operation: ${col.operation}`);
			lines.push("        config:");
			for (const [key, value] of Object.entries(col.config)) {
				if (value && typeof value === "object") {
					lines.push(`          ${key}:`);
					for (const [k, v] of Object.entries(value)) {
						lines.push(`            ${k}: ${v}`);
					}
				} else {
					lines.push(`          ${key}: ${value}`);
				}
			}
		}
		return lines.join("\n");
	}

	const previewEl = document.getElementById("pipeline-preview");
	previewEl.textContent = toYaml(pipeline);

	document.getElementById("pipeline-copy").addEventListener("click", async (event) => {
		const button = event.currentTarget;
		try {
			await navigator.clipboard.writeText(previewEl.textContent);
			button.innerHTML = `<i data-lucide="check" class="h-4 w-4"></i>`;
		} catch {
			button.innerHTML = `<i data-lucide="x" class="h-4 w-4"></i>`;
		}
		if (window.lucide) {
			window.lucide.createIcons();
		}
		setTimeout(() => {
			button.innerHTML = `<i data-lucide="copy" class="h-4 w-4"></i>`;
			if (window.lucide) {
				window.lucide.createIcons();
			}
		}, 1500);
	});

	if (window.lucide) {
		window.lucide.createIcons();
	}
</script>
