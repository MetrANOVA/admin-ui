<section class="flex flex-col items-center gap-4 px-[max(6rem,9.6vw)] pt-[max(4rem,12vh)] pb-[88px]">
	<div class="flex w-full max-w-[1348px] flex-col items-center gap-6">
		<div class="flex items-center justify-center gap-3">
			<i data-lucide="workflow" class="h-8 w-8 shrink-0 text-copy"></i>
			<h1 class="h1 display2 !font-sans">Pipelines</h1>
		</div>

		<div class="flex w-full items-center gap-4">
			<label class="pkts-input-text pkts-input-search min-w-0 flex-1" for="pipelines-search">
				<input
					id="pipelines-search"
					type="search"
					placeholder="Enter Value"
					aria-label="Search pipeline name"
					autocomplete="off"
				/>
				<div aria-hidden="true">
					<i data-lucide="search" class="h-5 w-5"></i>
				</div>
			</label>
			<a
				href="/define-pipeline"
				hx-get="/pages/define-pipelines.html"
				hx-target="#main-content"
				hx-push-url="/define-pipeline"
				class="inline-flex h-10 shrink-0 items-center gap-2 whitespace-nowrap rounded-full bg-accent px-5 text-sm font-semibold !text-white !no-underline transition hover:brightness-95"
			>
				Define New Pipeline
			</a>
		</div>

		<div class="mt-4 w-full overflow-x-auto">
			<table class="pkts-data-table mn-data-table w-full">
				<thead>
					<tr>
						<th scope="col" class="whitespace-nowrap">
							<div class="labelWrapper">
								<span>Type</span>
								<button
									type="button"
									class="inline-flex text-inherit opacity-70 transition-opacity hover:opacity-100"
									data-sort="definition_type"
									data-label="type"
									aria-label="Sort by type"
								>
									<i data-lucide="chevrons-up-down" class="h-4 w-4"></i>
								</button>
								<button
									type="button"
									class="inline-flex text-inherit opacity-70 transition-opacity hover:opacity-100"
									data-filter="type"
									aria-label="Filter by type"
								>
									<i data-lucide="filter" class="h-4 w-4"></i>
								</button>
							</div>
						</th>
						<th scope="col">
							<div class="labelWrapper">Pipeline Name</div>
						</th>
						<!-- Created By is unconfirmed — the API has no concept of users (see #3). -->
						<th scope="col" class="whitespace-nowrap">
							<div class="labelWrapper">
								<span>Created By</span>
								<button
									type="button"
									class="inline-flex text-inherit opacity-70 transition-opacity hover:opacity-100"
									data-filter="created_by"
									aria-label="Filter by created by"
								>
									<i data-lucide="filter" class="h-4 w-4"></i>
								</button>
							</div>
						</th>
						<th scope="col" class="whitespace-nowrap">
							<div class="labelWrapper">
								<span>Created Date</span>
								<button
									type="button"
									class="inline-flex text-inherit opacity-70 transition-opacity hover:opacity-100"
									data-filter="created_at"
									aria-label="Filter by created date"
								>
									<i data-lucide="filter" class="h-4 w-4"></i>
								</button>
							</div>
						</th>
					</tr>
				</thead>

				<tbody id="pipelines-rows">
					<tr>
						<td colspan="4" class="text-center text-copy-alt">Loading…</td>
					</tr>
				</tbody>

				<tfoot id="pipelines-foot">
					<tr>
						<td colspan="4">
							<div class="mn-pager" id="pipelines-pager"></div>
						</td>
					</tr>
				</tfoot>
			</table>
		</div>
	</div>
</section>

<script type="module">
	import { PagedTable, escapeHtml, shortDate } from "/scripts/paged-table.js";

	// Pipelines are the API's transformers, one page at a time from
	// GET /transformers/ with limit / offset / q / sort / order and the total in
	// X-Total-Count (MetrANOVA/api#42); the mock backend implements the same
	// contract. `definition_type` (data vs. metadata table) and `created_at` are
	// not in the real API yet: without them the type falls back to the
	// definition_ref prefix and the date to updated_at. Created By has no source.
	const TYPES = {
		data: { label: "Data Table", icon: "table-2" },
		metadata: { label: "Metadata Table", icon: "file-json" },
	};

	function typeOf(pipeline) {
		if (TYPES[pipeline.definition_type]) return pipeline.definition_type;
		return /^(def_)?meta_/.test(pipeline.definition_ref || "") ? "metadata" : "data";
	}

	function typeChip(type) {
		const { label, icon } = TYPES[type];
		return `<span class="pkts-chip cursor-default whitespace-nowrap"><i data-lucide="${icon}" class="h-4 w-4"></i>${label}</span>`;
	}

	const table = new PagedTable({
		url: `${window.ADMINUI_API_BASE}/transformers/`,
		tableEl: document.querySelector("#pipelines-rows").closest("table"),
		bodyEl: document.getElementById("pipelines-rows"),
		pagerEl: document.getElementById("pipelines-pager"),
		searchEl: document.getElementById("pipelines-search"),
		columnCount: () => 4,
		emptyText: "No pipelines match that search.",
		renderRows: (pipelines) =>
			pipelines
				.map((pipeline) => {
					const name = escapeHtml(pipeline.name);
					return `
						<tr
							class="cursor-pointer"
							hx-get="/pages/pipeline-detail.html"
							hx-target="#main-content"
							hx-push-url="/pipeline-details?id=${encodeURIComponent(pipeline.id)}"
						>
							<td data-parent="Type">${typeChip(typeOf(pipeline))}</td>
							<td data-parent="Pipeline Name" title="${name}">${name}</td>
							<td data-parent="Created By" class="whitespace-nowrap" title="Not provided by the API yet">—</td>
							<td data-parent="Created Date" class="whitespace-nowrap">${shortDate(pipeline.created_at || pipeline.updated_at)}</td>
						</tr>
					`;
				})
				.join(""),
	});

	table.load();
</script>
