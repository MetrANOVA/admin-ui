<section class="flex flex-col items-center gap-4 px-16 pt-[28px] pb-[88px]">
	<div class="flex w-full max-w-[1348px] flex-col items-center gap-6">
		<div class="flex items-center justify-center gap-3">
			<i data-lucide="workflow" class="h-8 w-8 shrink-0 text-copy"></i>
			<h1 class="h1 display2">Pipelines</h1>
		</div>

		<div class="flex w-full items-center gap-4">
			<label class="pkts-input-text pkts-input-search min-w-0 flex-1" for="pipelines-search">
				<input
					id="pipelines-search"
					type="search"
					placeholder="Search Pipeline Name"
					aria-label="Search pipeline name"
					autocomplete="off"
				/>
				<div aria-hidden="true">
					<i data-lucide="search" class="h-5 w-5"></i>
				</div>
			</label>
			<a
				href="/define-pipeline"
				hx-get="/pages/define-pipelines.html"
				hx-target="#main-content"
				hx-push-url="/define-pipeline"
				class="pkts-button shrink-0 whitespace-nowrap border-accent bg-accent text-white"
			>
				Define New Pipeline
			</a>
		</div>

		<div class="w-full overflow-x-auto">
			<table class="pkts-data-table w-full">
				<thead>
					<tr>
						<th scope="col" class="whitespace-nowrap">
							<div class="labelWrapper">
								<span>Type</span>
								<button
									type="button"
									class="inline-flex text-inherit opacity-70 transition-opacity hover:opacity-100"
									data-sort="type"
									aria-label="Sort by type"
								>
									<i data-lucide="chevrons-up-down" class="h-4 w-4"></i>
								</button>
								<button
									type="button"
									class="inline-flex text-inherit opacity-70 transition-opacity hover:opacity-100"
									data-filter="type"
									aria-label="Filter by type"
								>
									<i data-lucide="filter" class="h-4 w-4"></i>
								</button>
							</div>
						</th>
						<th scope="col" class="w-full">
							<div class="labelWrapper">Pipeline Name</div>
						</th>
						<!-- Created By is unconfirmed — the API has no concept of users (see #3). -->
						<th scope="col" class="whitespace-nowrap">
							<div class="labelWrapper">
								<span>Created By</span>
								<button
									type="button"
									class="inline-flex text-inherit opacity-70 transition-opacity hover:opacity-100"
									data-filter="created_by"
									aria-label="Filter by created by"
								>
									<i data-lucide="filter" class="h-4 w-4"></i>
								</button>
							</div>
						</th>
						<th scope="col" class="whitespace-nowrap">
							<div class="labelWrapper">
								<span>Created Date</span>
								<button
									type="button"
									class="inline-flex text-inherit opacity-70 transition-opacity hover:opacity-100"
									data-filter="created_at"
									aria-label="Filter by created date"
								>
									<i data-lucide="filter" class="h-4 w-4"></i>
								</button>
							</div>
						</th>
					</tr>
				</thead>

				<tbody id="pipelines-rows">
					<tr>
						<td colspan="4" class="text-center text-copy-alt">Loading…</td>
					</tr>
				</tbody>

				<tfoot id="pipelines-foot">
					<tr>
						<td colspan="4">
							<div
								class="flex flex-wrap items-center justify-center gap-2"
								id="pipelines-pager"
							></div>
						</td>
					</tr>
				</tfoot>
			</table>
		</div>
	</div>
</section>

<script type="module">
	// Layout pass for issue #6. Rows are placeholder data shaped like
	// GET /transformers/ (id, name, definition_ref, description, match_field).
	//
	// Paging, search and sort are client-side stand-ins, same as the Metadata
	// Manager list — they move to the API once it takes limit/offset/q/sort.
	// "Type" tells data tables from metadata tables; the API has no such field
	// yet, so it is derived from the definition_ref prefix for now.
	const PAGE_SIZE = 10;

	const TYPES = {
		data: { label: "Data Table", icon: "table-2" },
		metadata: { label: "Metadata Table", icon: "file-json" },
	};

	const PLACEHOLDER = [
		["all_interfaces", "def_interface", "07/13/27"],
		["data_flow", "def_flow", "04/12/27"],
		["data_flow_by_edge_as_1d", "def_flow", "07/13/27"],
		["data_flow_by_edge_as_1d_mv", "def_flow", "04/12/27"],
		["meta_interface", "meta_interface", "07/13/27"],
		["data_flow_by_edge_as_5m", "def_flow", "07/13/27"],
		["data_flow_by_edge_as_5m_mv", "def_flow", "04/12/27"],
		["data_flow_by_edge_esdb_5m", "def_flow", "07/13/27"],
		["meta_interface_esdb", "meta_interface", "04/12/27"],
		["meta_organization", "meta_organization", "07/13/27"],
		["meta_ip", "meta_ip", "07/13/27"],
		["meta_device", "meta_device", "07/13/27"],
		["data_flow_by_pop_1h", "def_flow", "05/02/27"],
		["meta_as", "meta_as", "05/02/27"],
	].map(([id, definition_ref, created_at]) => ({
		id,
		name: id,
		definition_ref,
		type: definition_ref.startsWith("meta_") ? "metadata" : "data",
		created_by: "jlee@es.net",
		created_at,
	}));

	const rowsEl = document.getElementById("pipelines-rows");
	const pagerEl = document.getElementById("pipelines-pager");
	const searchEl = document.getElementById("pipelines-search");
	const footEl = document.getElementById("pipelines-foot");
	const sortEl = document.querySelector("[data-sort='type']");

	let query = "";
	let page = 1;
	let sortDir = 0; // 0 = as listed, 1 = data first, -1 = metadata first

	function visibleRows() {
		const q = query.trim().toLowerCase();
		let rows = q ? PLACEHOLDER.filter((row) => row.name.toLowerCase().includes(q)) : PLACEHOLDER;
		if (sortDir) {
			rows = [...rows].sort((a, b) => sortDir * a.type.localeCompare(b.type));
		}
		return rows;
	}

	function typeChip(type) {
		const { label, icon } = TYPES[type];
		return `<span class="pkts-chip cursor-default whitespace-nowrap"><i data-lucide="${icon}" class="h-4 w-4"></i>${label}</span>`;
	}

	function renderRows(rows) {
		if (!rows.length) {
			rowsEl.innerHTML = `<tr><td colspan="4" class="text-center text-copy-alt">No pipelines match that search.</td></tr>`;
			return;
		}
		rowsEl.innerHTML = rows
			.map(
				(row) => `
					<tr
						class="cursor-pointer"
						hx-get="/pages/pipeline-detail.html"
						hx-target="#main-content"
						hx-push-url="/pipeline-details?id=${encodeURIComponent(row.id)}"
					>
						<td data-parent="Type">${typeChip(row.type)}</td>
						<td data-parent="Pipeline Name">${row.name}</td>
						<td data-parent="Created By" class="whitespace-nowrap">${row.created_by}</td>
						<td data-parent="Created Date" class="whitespace-nowrap">${row.created_at}</td>
					</tr>
				`,
			)
			.join("");
		// Rows are rendered after htmx scanned the page, so their hx-* need processing.
		if (window.htmx) {
			window.htmx.process(rowsEl);
		}
	}

	function pageButton(label, targetPage, { active = false, disabled = false } = {}) {
		const variant = active ? "pkts-primary" : "pkts-secondary";
		return `<button type="button" class="pkts-button pkts-small ${variant}" data-page="${targetPage}"${
			disabled ? " disabled" : ""
		}>${label}</button>`;
	}

	function renderPager(totalPages) {
		// Packets sets display:table-footer-group on tfoot, which outranks
		// Tailwind's .hidden, so it has to be hidden inline.
		footEl.style.display = totalPages <= 1 ? "none" : "";
		if (totalPages <= 1) {
			pagerEl.innerHTML = "";
			return;
		}
		const parts = [pageButton("Prev", page - 1, { disabled: page === 1 })];
		const shown = [...new Set([1, page, totalPages])].sort((a, b) => a - b);
		let previous = 0;
		for (const n of shown) {
			if (n - previous > 1) {
				parts.push(`<span class="px-1 text-copy-alt">…</span>`);
			}
			parts.push(pageButton(String(n), n, { active: n === page }));
			previous = n;
		}
		parts.push(pageButton("Next", page + 1, { disabled: page === totalPages }));
		pagerEl.innerHTML = parts.join("");
	}

	function render() {
		const rows = visibleRows();
		const totalPages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
		page = Math.min(page, totalPages);
		renderRows(rows.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE));
		renderPager(totalPages);
		if (window.lucide) {
			window.lucide.createIcons();
		}
	}

	searchEl.addEventListener("input", (event) => {
		query = event.target.value;
		page = 1;
		render();
	});

	sortEl.addEventListener("click", () => {
		sortDir = sortDir === 1 ? -1 : 1;
		page = 1;
		render();
	});

	pagerEl.addEventListener("click", (event) => {
		const button = event.target.closest("[data-page]");
		if (!button || button.disabled) {
			return;
		}
		page = Number(button.dataset.page);
		render();
	});

	render();
</script>
